
{{ if .Get "aside" }}
<aside>
{{ else if .Get "smallaside" }}
<aside class="small">
{{ else if .Get "xsmallaside" }}
<aside class="x-small">
{{ end }}

    <figure>
        {{ $src := .Get "src" }}
        {{ $alt := .Get "alt" }}
        {{ $size := .Get "size" }}
        {{ $isSVG := eq (lower (path.Ext $src)) ".svg" }}
        {{ $imgStyle := "" }}
        {{ with .Get "width" }}{{ $imgStyle = printf "width: %s; max-width: 100%%;" . }}{{ end }}

        {{ $img := resources.Get $src }}
        {{- if not $img -}}
            {{- $img = resources.Get $src -}}
        {{- end -}}
        {{- if not $img -}}
            {{- $img = .Page.Resources.GetMatch $src -}}
        {{- end -}}

        {{ if $isSVG }}

            {{/* SVG is a vector format and cannot go through Hugo's raster
                 resize pipeline, so emit it directly. */}}
            {{ $svgURL := $src }}
            {{ with $img }}{{ $svgURL = .RelPermalink }}{{ end }}
            <img src="{{ $svgURL | safeURL }}" alt="{{ $alt }}"{{ with $imgStyle }} style="{{ . | safeCSS }}"{{ end }} loading="lazy" decoding="async">

        {{ else }}
            {{ with $img }}

            {{ if (not $size) }}
                {{ $size = printf "%dx%d" .Width .Height }}
            {{ end }}

            {{ $resizedImg := printf "%s" $size | .Resize }}
            {{ $resizedImgWebp := printf "%s webp picture" $size | .Resize }}

            <picture{{ with $imgStyle }} style="{{ . | safeCSS }}"{{ end }}>
                <source srcset="{{ $resizedImgWebp.Permalink }}" type="image/webp" />
                <img src="{{ $resizedImg.Permalink }}" alt="{{ $alt }}"{{ with $imgStyle }} style="{{ . | safeCSS }}"{{ end }} loading="lazy" decoding="async">
            </picture>

            {{ end }}
        {{ end }}
        <figcaption>
            {{ with .Get "icon" }}
                <i class="{{ . }}" aria-hidden="true"></i>
            {{ end }}
            {{ .Inner | .Page.RenderString }}
        </figcaption>
    </figure>

{{ if or (.Get "aside") (.Get "smallaside") (.Get "xsmallaside") }}
</aside>
{{ end }}
