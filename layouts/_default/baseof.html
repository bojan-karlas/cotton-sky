<!DOCTYPE html>
<html lang="en">
    <head>
        {{- partial "meta/head.html" . -}}
        {{- block "head" . }}{{- end }}
    </head>
    <body>
        <header>
            {{- partial "elements/header.html" . -}}
        </header>
        <main>
            <aside class="right sticky">
                <nav class="js-toc"></nav>
            </aside>

            {{- partial "elements/title.html" . -}}
            
            {{- block "main" . }}{{- end }}
        </main>
        <footer>
            {{- partial "elements/footer.html" . -}}
        </footer>

        {{- if ne .Site.Params.showFab false }}
        <div class="fab-stack">
            <button type="button" class="scroll-top" aria-label="Scroll to top" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
            <div class="toc-fab">
                <nav class="toc-fab-list" aria-label="On this page"></nav>
            </div>
        </div>
        {{- end }}
    </body>
</html>
